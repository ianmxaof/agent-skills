#   behavior:
#     - Test misclicks, rapid actions, partial completion
#     - Surface dark patterns and hidden consequences
#     - Check accessibility edge cases
#
# agent-b:
#   skill: refinement-layer
#   mode: generic
#   output: artifacts/incoming/
#   behavior:
#     - Merge similar UX issues
#     - Rank by user impact
#     - Clarify reproduction steps
#
# expected-output:
#   typical-finding-count: "5-8 findings"
#   compression-ratio: "2:1"
#   common-categories:
#     - accessibility
#     - error-handling
#     - user-trust
#     - dark-patterns
#
# when-to-use:
#   - Pre-release UI audit
#   - After major UX redesign
#   - When user complaints increase
#
# when-not-to-use:
#   - Backend-only changes
#   - Quick copy fixes
