# Column Configuration Template
#
# Use this template to define a 2-agent column for structured analysis.
# Each column produces one artifact through the Agent A → Agent B pipeline.
#
# Copy this file and customize for your column.

# Column Identity
column:
  name: <column-name>                    # e.g., "ux-adversarial", "architecture", "performance"
  purpose: <what this column detects>    # e.g., "Surface adversarial UX failure modes"
  description: |
    <Longer description of what this column is for and when to use it>

# Agent A Configuration (Exploration Layer)
agent-a:
  skill: <skill-name>                    # e.g., "adversarial-ui-tester"
  posture: exploratory                   # Always "exploratory" for Agent A
  output: raw                            # Output is passed to Agent B, not persisted
  
  # Agent A behavior notes
  behavior:
    - Maximize coverage
    - Allow mess
    - Don't self-censor
    - Don't deduplicate
    - Don't rank by importance

# Agent B Configuration (Refinement Layer)
agent-b:
  skill: refinement-layer                # Usually the generic refinement-layer meta-skill
  mode: generic | domain-aware | effectiveness
  
  # If mode is domain-aware, specify the lens skill
  domain-skill: <skill-name>             # e.g., "ux-copy-neutrality-checker"
  
  output: artifacts/incoming/            # Final artifact location
  
  # Agent B behavior notes
  behavior:
    - Deduplicate
    - Rank by severity
    - Clarify for actionability
    - Enforce handoff protocol
    - Produce one artifact

# Expected Output Characteristics
expected-output:
  typical-finding-count: <range>         # e.g., "5-10 findings"
  compression-ratio: <ratio>             # e.g., "3:1" (Agent A produces 3x more than Agent B outputs)
  common-categories:
    - <category1>                        # e.g., "accessibility"
    - <category2>                        # e.g., "error-handling"
    - <category3>                        # e.g., "user-trust"

# When to Use This Column
when-to-use:
  - <scenario 1>                         # e.g., "Pre-release UI audit"
  - <scenario 2>                         # e.g., "After major UX changes"
  - <scenario 3>                         # e.g., "When adversarial testing is needed"

# When NOT to Use This Column
when-not-to-use:
  - <anti-scenario 1>                    # e.g., "Quick fixes to existing flows"
  - <anti-scenario 2>                    # e.g., "Non-user-facing changes"

# Invocation Examples
invocation:
  pattern: "Run {column-name} column on {target}"
  examples:
    - "Run ux-adversarial column on the checkout flow"
    - "Run ux-adversarial column on the onboarding wizard"

---
