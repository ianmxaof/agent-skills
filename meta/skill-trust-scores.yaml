# ============================================================================
# NOTES
# ============================================================================

# Trust Score Calculation:
# trust_score = (
#     0.4 * actionable_rate +
#     0.3 * (1 - false_positive_rate) +
#     0.2 * (1 - override_rate) +
#     0.1 * recency_factor
# )
#
# Lifecycle Stages:
# - experimental: 0.7x router weight
# - validated: 1.0x router weight
# - preferred: 1.1x router weight
# - default: 1.2x router weight
# - legacy: 0.5x router weight
# - deprecated: 0.1x router weight
#
# This file should be updated:
# - Automatically by skill-effectiveness-analyzer
# - Manually during weekly/monthly reviews
# - When promoting or demoting skills

